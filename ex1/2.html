<!DOCTYPE html>
<html>
<head>
<title>Movie Reservation System</title>
<link rel="stylesheet" href="movie.css">
</head>
<body>
<div class="container">
    <a href="1.html" class="back">← Back to Home</a>
    <h1>WELCOME TO MOVIE RESERVATION PAGE</h1>
    <h2>TRENDING MOVIES</h2>
    <table>
        <tr>
            <th>MOVIE NAME</th>
            <th>SHOW</th>
            <th>TIMING</th>
            <th>PRICE</th>
            <th>POSTER</th>
        </tr>
        <tr>
            <td>JANANAYAGAN</td>
            <td>EVENING</td>
            <td>06:30 to 10:30</td>
            <td>₹150</td>
            <td>
                <img src="images.jpg" width="120" height="180">
            </td>
        </tr>
    </table>
    <div class="reservation">
        <h2>Movie Reservation</h2>
        <label>SELECT MOVIE</label>
        <input type="text" placeholder="Enter movie name">
        <label>SELECT TIMING</label>
        <input type="text" placeholder="Enter show timing">
        <label>SELECT SEAT</label>
        <input type="text" placeholder="Enter seat number">
        <input type="submit" value="BOOK TICKET">
    </div>
    <div class="guidelines">
        <h2>Guidelines</h2>
        <ul>
            <li>Do not bring outside food.</li>
            <li>Be on time.</li>
            <li>For an A-grade movie, bring ID proof.</li>
        </ul>
    </div>
</div>
</body>
</html>
